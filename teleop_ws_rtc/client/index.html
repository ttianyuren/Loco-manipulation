<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIAGo Robot Web Control</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .main-content { display: flex; gap: 20px; }
        .video-container { flex: 2; text-align: center; }
        #video { max-width: 100%; border: 2px solid #ddd; border-radius: 8px; background: #000; }
        .controls { flex: 1; background: #f8f9fa; padding: 20px; border-radius: 8px; }
        .control-section { margin-bottom: 25px; }
        .control-section h3 { margin-bottom: 15px; color: #333; }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .control-btn { padding: 15px; border: none; border-radius: 5px; background: #007bff; color: white; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .control-btn:hover { background: #0056b3; }
        .control-btn:active { background: #003d82; }
        .status-panel { background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .slider-container { margin: 15px 0; }
        .slider-container label { display: block; margin-bottom: 5px; font-weight: bold; }
        .slider { width: 100%; margin-bottom: 10px; }
        .connection-status { padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .mocap-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .mocap-btn { flex: 1; padding: 10px; border: none; border-radius: 5px; background: #6c757d; color: white; cursor: pointer; }
        .mocap-btn.active { background: #28a745; }
        .latency-info { margin-top: 20px; font-size: 0.9em; color: #666; }
        .latency-metrics { display: flex; flex-direction: column; gap: 5px; }
        .latency-metric { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
        .metric-label { font-weight: 600; color: #333; }
        .metric-value { font-family: 'Courier New', monospace; font-weight: bold; padding: 2px 6px; border-radius: 3px; background: #f8f9fa; }
        .metric-value.good { color: #28a745; background: #d4f6dd; }
        .metric-value.warning { color: #ffc107; background: #fff8db; }
        .metric-value.bad { color: #dc3545; background: #f8d7da; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TIAGo Robot Web Control Interface</h1>
            <div id="connectionStatus" class="connection-status disconnected">Disconnected</div>
        </div>
        <div class="main-content">
            <div class="video-container">
                <video id="video" autoplay playsinline></video>
            </div>
            <div class="controls">
                <div class="control-section">
                    <h3>Robot Status</h3>
                    <div class="status-panel">
                        <div>Current Target: <span id="currentTarget">Base</span></div>
                        <div>Step Size: <span id="stepSizeValue">0.02</span></div>
                    </div>
                </div>
                <div class="control-section">
                    <h3>Target Selection</h3>
                    <div class="mocap-selector">
                        <button class="mocap-btn active" data-target="0">Base</button>
                        <button class="mocap-btn" data-target="1">Left Arm</button>
                        <button class="mocap-btn" data-target="2">Right Arm</button>
                    </div>
                </div>
                <div class="control-section">
                    <h3>Movement Controls</h3>
                    <div class="button-grid">
                        <div></div>
                        <button class="control-btn" onclick="singleStep('move_x', 1)">↑ Forward</button>
                        <div></div>
                        <button class="control-btn" onclick="singleStep('move_y', -1)">← Left</button>
                        <button class="control-btn" onclick="singleStep('move_x', -1)">↓ Backward</button>
                        <button class="control-btn" onclick="singleStep('move_y', 1)">→ Right</button>
                        <div></div>
                    </div>
                    <div class="button-grid">
                        <button class="control-btn" onclick="singleStep('move_z', 1)">↑ Up</button>
                        <button class="control-btn" onclick="singleStep('move_z', -1)">↓ Down</button>
                        <button class="control-btn" onclick="singleStep('rotate_z', 1)">↻ Rotate</button>
                    </div>
                </div>
                <div class="control-section">
                    <h3>Settings</h3>
                    <div class="slider-container">
                        <label for="stepSize">Step Size:</label>
                        <input type="range" id="stepSize" class="slider" min="0.001" max="0.1" step="0.001" value="0.02">
                        <span id="stepSizeDisplay">0.02</span>
                    </div>
                    <div style="margin-top:15px;">
                        <label for="iceToggle" style="font-weight:bold;">ICE Server:</label>
                        <select id="iceToggle">
                            <option value="none" selected>None (Local)</option>
                            <option value="stun">STUN (Remote)</option>
                        </select>
                    </div>
                </div>
                <div class="latency-info" id="latency-display">
                    <div style="font-weight: bold; margin-bottom: 10px;">Latency Monitor:</div>
                    <div class="latency-metrics">
                        <div class="latency-metric">
                            <span class="metric-label">Ping:</span>
                            <span id="ping-latency" class="metric-value">N/A</span>
                        </div>
                        <div class="latency-metric">
                            <span class="metric-label">Video:</span>
                            <span id="video-latency" class="metric-value">N/A</span>
                        </div>
                        <div class="latency-metric">
                            <span class="metric-label">Command:</span>
                            <span id="command-latency" class="metric-value">N/A</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="webrtc.js"></script>
    <script src="robot.js"></script>
</body>
</html>
